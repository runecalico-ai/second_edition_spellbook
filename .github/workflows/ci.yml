name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        working-directory: apps/desktop
        run: pnpm run lint:biome

      - name: Knip
        working-directory: apps/desktop
        run: pnpm run knip

      - name: Format check (JS)
        working-directory: apps/desktop
        run: pnpm format:check

      - name: Type check (JS)
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Unit tests (build scripts)
        run: node --test scripts/tauri_build.test.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.91.1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            services/ml/requirements*.txt
            services/ml/pyproject.toml

      - name: Create Python virtualenv
        working-directory: services/ml
        run: python -m venv .venv

      - name: Install Python dependencies
        working-directory: services/ml
        run: .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Python)
        working-directory: services/ml
        run: .venv/bin/python -m ruff check .

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check (Python)
        working-directory: services/ml
        run: .venv/bin/python -m ruff format --check .

      - name: Unit tests (Python)
        working-directory: services/ml
        run: .venv/bin/python -m pytest

      - name: Unit tests (release scripts)
        run: >-
          services/ml/.venv/bin/python -m pytest
          scripts/test_provision_sqlite_vec.py
          scripts/test_set_release_version.py
          scripts/test_checksum_release_assets.py

      - name: Install system dependencies (Rust)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Format check (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check

      - name: Clippy (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (Rust)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Check (Rust, no default features)
        working-directory: apps/desktop/src-tauri
        run: cargo check --no-default-features

      - name: Clippy (Rust, no default features)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --no-default-features -- -D warnings
