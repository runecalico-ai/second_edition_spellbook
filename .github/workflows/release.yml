name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ github.event_name != 'push' && 'pnpm' || '' }}
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.91.1
        with:
          components: rustfmt, clippy

      - name: Assert Windows host triple
        run: |
          $t = (rustc --print host-tuple).Trim()
          if ($t -ne 'x86_64-pc-windows-msvc') { throw "unsupported host triple $t" }

      - name: Restore Cargo cache
        id: cargo-cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release/*
            !target/release/bundle
          key: ${{ runner.os }}-release-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Assert cache restored no bundles
        if: steps.cargo-cache.outputs.cache-hit == 'true'
        run: |
          if (Test-Path target/release/bundle) { throw 'Cargo cache restored target/release/bundle; stale installers must never be cached' }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: ${{ github.event_name != 'push' && 'pip' || '' }}
          cache-dependency-path: |
            services/ml/requirements-release.lock

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Create Python venv and install
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --require-hashes --only-binary=:all: -r services/ml/requirements-release.lock

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .\.venv\Scripts\python scripts/set_release_version.py "$env:REF_NAME"

      - name: Prepare release resources
        run: .\.venv\Scripts\python scripts/prepare_release_bundle.py

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: pnpm tauri:build:win

      # Caches are ref-scoped: only workflow_dispatch runs on the default branch save,
      # which seeds the Cargo cache that later dispatch runs restore.
      - name: Save Cargo cache
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release/*
            !target/release/bundle
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $bundleDir = 'target/release/bundle/nsis'
          $exes = @(Get-ChildItem -Path $bundleDir -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($exes.Count -ne 1) { throw "expected exactly one NSIS installer in $bundleDir, found $($exes.Count): $($exes.Name -join ', ')" }
          New-Item -ItemType Directory -Force assets | Out-Null
          $pkg = Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json
          $name = "Spellbook_$($pkg.version)_x64-setup.exe"
          Copy-Item $exes[0].FullName "assets/$name"
          .\.venv\Scripts\python scripts/checksum_release_assets.py "assets/$name"
          if ($LASTEXITCODE -ne 0) { throw "checksum failed with exit code $LASTEXITCODE" }
          $sidecar = Get-Content -Raw -LiteralPath "assets/$name.sha256"
          $tokens = $sidecar.TrimEnd("`n") -split '  ', 2
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "assets/$name").Hash.ToLowerInvariant()
          if ($tokens[0] -cne $hash) { throw "sidecar digest '$($tokens[0])' does not match Get-FileHash '$hash'" }
          if ($tokens[1] -cne $name) { throw "sidecar names '$($tokens[1])', expected '$name'" }
          if ($sidecar -cne "$hash  $name`n") { throw "sidecar for $name is not a single LF-terminated line" }
          $sig = Get-AuthenticodeSignature "assets/$name"
          if ($sig.Status -ne 'NotSigned') { throw "expected unsigned installer, got $($sig.Status)" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spellbook-${{ runner.os }}
          path: assets/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            file \
            libfuse2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ github.event_name != 'push' && 'pnpm' || '' }}
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.91.1
        with:
          components: rustfmt, clippy

      - name: Assert Linux host triple
        run: |
          t=$(rustc --print host-tuple || true)
          test "$t" = "x86_64-unknown-linux-gnu"

      - name: Restore Cargo cache
        id: cargo-cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release/*
            !target/release/bundle
          key: ${{ runner.os }}-release-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Assert cache restored no bundles
        if: steps.cargo-cache.outputs.cache-hit == 'true'
        run: |
          if [ -e target/release/bundle ]; then
            echo '::error::Cargo cache restored target/release/bundle; stale installers must never be cached' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: ${{ github.event_name != 'push' && 'pip' || '' }}
          cache-dependency-path: |
            services/ml/requirements-release.lock

      - name: Install JS dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Create Python venv and install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r services/ml/requirements-release.lock

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .venv/bin/python scripts/set_release_version.py "$REF_NAME"

      - name: Prepare release resources
        run: .venv/bin/python scripts/prepare_release_bundle.py

      - name: Build AppImage and deb
        working-directory: apps/desktop
        run: pnpm tauri:build:linux

      - name: Save Cargo cache
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release/*
            !target/release/bundle
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Stage Linux assets
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage in target/release/bundle/appimage, found ${#appimages[@]}: ${appimages[*]}"
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb in target/release/bundle/deb, found ${#debs[@]}: ${debs[*]}"
            exit 1
          fi
          mkdir -p assets
          VERSION=$(.venv/bin/python -c "import json; print(json.load(open('apps/desktop/package.json'))['version'])")
          cp "${appimages[0]}" "assets/Spellbook_${VERSION}_amd64.AppImage"
          cp "${debs[0]}" "assets/Spellbook_${VERSION}_amd64.deb"
          .venv/bin/python scripts/checksum_release_assets.py \
            "assets/Spellbook_${VERSION}_amd64.AppImage" \
            "assets/Spellbook_${VERSION}_amd64.deb"
          (cd assets && sha256sum -c --strict -- \
            "Spellbook_${VERSION}_amd64.AppImage.sha256" \
            "Spellbook_${VERSION}_amd64.deb.sha256")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spellbook-${{ runner.os }}
          path: assets/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: spellbook-*
          merge-multiple: true

      - name: Verify release assets
        working-directory: assets
        run: |
          shopt -s nullglob dotglob
          all=(*)
          expected=()
          for pattern in 'Spellbook_*_x64-setup.exe' 'Spellbook_*_amd64.AppImage' 'Spellbook_*_amd64.deb'; do
            matches=($pattern)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "::error::expected exactly one $pattern file, found ${#matches[@]}: ${matches[*]}"
              exit 1
            fi
            asset="${matches[0]}"
            if [ ! -f "$asset.sha256" ]; then
              echo "::error::missing checksum sidecar $asset.sha256"
              exit 1
            fi
            listed=""
            read -r _ listed < "$asset.sha256" || true
            if [ "$listed" != "$asset" ]; then
              echo "::error::$asset.sha256 lists '$listed', expected '$asset'"
              exit 1
            fi
            expected+=("$asset" "$asset.sha256")
          done
          if [ "${#all[@]}" -ne "${#expected[@]}" ]; then
            echo "::error::expected exactly ${expected[*]}, found ${all[*]}"
            exit 1
          fi
          sha256sum -c --strict -- *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(release create "$REF_NAME" --generate-notes --verify-tag)
          if [[ "$REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" assets/*
