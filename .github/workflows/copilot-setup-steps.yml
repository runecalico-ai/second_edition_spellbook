# Generated by OpenSpec for GitHub Copilot coding agent support.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install OpenSpec CLI
        run: npm ci --prefix .github/openspec-cli

      - name: Add OpenSpec CLI to PATH
        run: echo "$GITHUB_WORKSPACE/.github/openspec-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify OpenSpec CLI
        run: openspec --version
